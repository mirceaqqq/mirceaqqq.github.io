<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Pentru Ionela</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<style>
:root{ --gold:#f0c869; --sky1:#1c0f22; --sky2:#3a1f3c; --sky3:#5e2c50; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;}
body{
  font-family:Georgia,'Iowan Old Style','Times New Roman',serif;
  background:radial-gradient(ellipse 130% 75% at 50% -5%, var(--sky3), var(--sky2) 55%, var(--sky1) 100%);
  height:100dvh;width:100vw;overflow:hidden;position:relative;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  user-select:none;touch-action:manipulation;
}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:block;}
.moon{position:absolute;top:5%;right:9%;width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff8e8,var(--gold) 70%);
  box-shadow:0 0 60px 14px rgba(240,200,105,.45);z-index:1;opacity:.9;}
#stage{position:relative;z-index:5;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}

#btn{position:relative;border:none;cursor:pointer;font-family:inherit;
  padding:20px 3rem;font-size:clamp(1rem,4.5vw,1.35rem);letter-spacing:.5px;color:#3c1f2a;
  border-radius:60px;background:linear-gradient(120deg,var(--gold),#fff1cf,var(--gold));
  background-size:220% auto;box-shadow:0 0 0 0 rgba(240,200,105,.55),0 14px 34px rgba(0,0,0,.45);
  animation:glow 2.2s ease-in-out infinite,shimmer 5s linear infinite;-webkit-appearance:none;appearance:none;}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(240,200,105,.55),0 14px 34px rgba(0,0,0,.45);}50%{box-shadow:0 0 0 16px rgba(240,200,105,0),0 14px 34px rgba(0,0,0,.45);}}
@keyframes shimmer{to{background-position:220% center;}}

#msgWrap{position:absolute;top:9%;left:50%;transform:translateX(-50%) translateY(-16px);
  text-align:center;z-index:6;opacity:0;width:92%;}
#msg{font-size:clamp(1.9rem,7vw,3.2rem);color:#fff5f0;font-style:italic;
  text-shadow:0 0 26px rgba(240,150,180,.65),0 2px 8px rgba(0,0,0,.4);}
#msg .accent{color:var(--gold);font-style:normal;font-weight:bold;}

#garden{position:absolute;bottom:0;left:0;width:100%;height:60vh;z-index:3;pointer-events:none;}
.fl{position:absolute;bottom:0;opacity:0;transform-origin:bottom center;left:0;}
.fl.back{filter:blur(1.5px) brightness(.82);z-index:1;}
.fl.mid{filter:brightness(.94);z-index:2;}
.fl.front{z-index:3;}
.fl svg{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.4));}
.fl.sway{animation:sway 3.4s ease-in-out infinite;}
@keyframes sway{0%,100%{transform:rotate(-2.2deg);}50%{transform:rotate(2.2deg);}}

/* stare initiala pt fallback CSS (fara GSAP) */
.fl.css-init{transform:translateY(60px) scale(.3);opacity:0;}
.fl.css-grow{animation:rise .85s cubic-bezier(.2,1.6,.4,1) forwards;animation-delay:calc(var(--i)*0.09s);}
@keyframes rise{0%{opacity:0;transform:translateY(60px) scale(.3);}60%{opacity:1;transform:translateY(-8px) scale(1.06);}100%{opacity:1;transform:translateY(0) scale(1);}}

.firefly{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff3c2;
  box-shadow:0 0 8px 3px rgba(255,240,180,.8);opacity:0;z-index:4;animation:fly 9s ease-in-out infinite, flicker 2.4s ease-in-out infinite;}
@keyframes flicker{0%,100%{opacity:0;}50%{opacity:.9;}}
@keyframes fly{0%{transform:translate(0,0);}25%{transform:translate(30px,-40px);}50%{transform:translate(-20px,-70px);}75%{transform:translate(40px,-30px);}100%{transform:translate(0,0);}}

.ground{position:absolute;bottom:0;left:0;width:100%;height:8vh;z-index:2;background:linear-gradient(to top,rgba(15,8,20,.9),transparent);}
@media (max-width:480px){
  #garden{height:56vh;}
  .moon{width:46px;height:46px;top:4%;right:8%;}
  #msgWrap{top:7%;}
}
@media (max-height:700px){
  #garden{height:48vh;}
}
</style>
</head>

<script>
(function(){
"use strict";
/* ---- fundal: stele + petale (canvas, fara librarii) ---- */
var canvas=document.getElementById('bg'),ctx=canvas.getContext('2d'),W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=canvas.width=innerWidth*DPR;H=canvas.height=innerHeight*DPR;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
resize();addEventListener('resize',resize);

var stars=[];for(var i=0;i<70;i++){stars.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight*0.6,r:Math.random()*1.6+0.4,ph:Math.random()*Math.PI*2});}

var petalColors=['#f5a3bb','#f78fac','#ffd6e4','#e8687f'];
function Petal(burst){this.reset(burst);}
Petal.prototype.reset=function(burst){
  this.x=Math.random()*innerWidth;this.y=burst?innerHeight*0.5:-20-Math.random()*innerHeight;
  this.s=5+Math.random()*8;this.rot=Math.random()*360;this.rotSpd=(Math.random()-.5)*3.5;
  this.color=petalColors[Math.floor(Math.random()*petalColors.length)];
  if(burst){var a=Math.random()*Math.PI*2,sp=3+Math.random()*7;this.vx=Math.cos(a)*sp;this.vy=Math.sin(a)*sp-4;this.grav=.16;this.life=0;}
  else{this.vx=(Math.random()-.5)*.6;this.vy=.4+Math.random()*.9;this.grav=0;}
};
Petal.prototype.step=function(){if(this.grav){this.vy+=this.grav;this.life++;}this.x+=this.vx;this.y+=this.vy;this.rot+=this.rotSpd;};
Petal.prototype.draw=function(){ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot*Math.PI/180);ctx.fillStyle=this.color;ctx.globalAlpha=this.grav?Math.max(0,1-this.life/70):0.8;ctx.beginPath();ctx.ellipse(0,0,this.s*.6,this.s,0,0,Math.PI*2);ctx.fill();ctx.restore();};

var ambient=[];for(var j=0;j<26;j++){ambient.push(new Petal(false));}
var burstList=[];
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  var t=Date.now()/1000;ctx.fillStyle='#fff';
  for(var k=0;k<stars.length;k++){var st=stars[k];ctx.globalAlpha=.35+.5*Math.abs(Math.sin(t*.8+st.ph));ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  for(var a=0;a<ambient.length;a++){var p=ambient[a];p.step();if(p.y>innerHeight+20){p.reset(false);}p.draw();}
  for(var b=burstList.length-1;b>=0;b--){var bp=burstList[b];bp.step();bp.draw();if(bp.life>70||bp.y>innerHeight+60){burstList.splice(b,1);}}
  requestAnimationFrame(tick);
}
tick();
function burst(count){for(var i=0;i<count;i++){burstList.push(new Petal(true));}}

/* ---- licurici ---- */
var ffWrap=document.getElementById('fireflies');
for(var f=0;f<10;f++){
  var el=document.createElement('div');el.className='firefly';
  el.style.left=(5+Math.random()*90)+'%';el.style.bottom=(5+Math.random()*35)+'vh';
  el.style.animationDelay=(Math.random()*6)+'s, '+(Math.random()*3)+'s';
  ffWrap.appendChild(el);
}

/* ---- deschidere: GSAP daca e disponibil, altfel fallback CSS ---- */
var btn=document.getElementById('btn'),msgWrap=document.getElementById('msgWrap'),opened=false;
var flowers=document.querySelectorAll('.fl');

function afterReveal(){
  flowers.forEach(function(el){ el.classList.add('sway'); });
}

function openWithGSAP(){
  var tl=gsap.timeline({ onComplete:afterReveal });
  tl.to(btn,{ scale:0, opacity:0, duration:.45, ease:'back.in(2)' })
    .call(function(){ burst(60); })
    .fromTo(flowers,
      { y:70, scale:.3, opacity:0, rotate:0 },
      { y:0, scale:1, opacity:1, duration:.9, ease:'elastic.out(1,0.6)',
        stagger:{ each:0.06, from:'center' } }, '-=0.05')
    .fromTo(msgWrap, { opacity:0, y:-18 }, { opacity:1, y:0, duration:1, ease:'power2.out' }, '-=0.4');
}

function openWithCSS(){
  btn.style.transition='transform .5s cubic-bezier(.6,-.4,.7,0), opacity .5s ease';
  btn.style.transform='scale(0)'; btn.style.opacity='0';
  burst(60);
  setTimeout(function(){
    flowers.forEach(function(el){ el.classList.add('css-init'); void el.offsetWidth; el.classList.add('css-grow'); });
    burst(30);
  },280);
  setTimeout(function(){ msgWrap.style.transition='opacity 1s ease, transform 1s ease'; msgWrap.style.opacity='1'; msgWrap.style.transform='translateX(-50%) translateY(0)'; afterReveal(); },900);
}

function openGift(){
  if(opened) return; opened=true;
  if(typeof gsap!=='undefined'){ openWithGSAP(); } else { openWithCSS(); }
}
btn.addEventListener('click', openGift);
btn.addEventListener('touchend', function(e){ e.preventDefault(); openGift(); }, {passive:false});
})();
</script>
